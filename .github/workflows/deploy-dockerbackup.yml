name: Deploy Docker Backup

on:
  push:
    branches:
      - main
    paths:
      - 'docker-backup/**'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Fetch Latest Code & Deploy
        run: |
          cd /home/cargo/docker/docker-backup 

          git fetch --all
          git reset --hard origin/main
          
          docker compose up -d --remove-orphans
