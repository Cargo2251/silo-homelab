name: Deploy Uptime-Kuma

on:
  push:
    branches:
      - main
    paths:
      - 'uptime-kuma/**'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Fetch Latest Code & Deploy
        run: |
          cd /home/cargo/docker/uptime-Kuma

          git fetch --all
          git reset --hard origin/main
          
          docker compose up -d --remove-orphans
