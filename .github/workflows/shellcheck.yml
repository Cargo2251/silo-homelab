--- 
name: Bash Shellcheck

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/shellcheck.yml'
    
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Runs shellcheck
        run: find scripts/ -name "*.sh" -exec shellcheck {} +
